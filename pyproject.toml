[project]
name = "astrbot-plugin-t2i-service"
version = "1.0.0"
description = "AstrBot 插件：在 AstrBot 进程内提供文转图（HTML/模板 → 图片）渲染服务；同一仓库也可独立部署为 FastAPI 服务。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "playwright>=1.54.0",
]

[project.optional-dependencies]
# 独立服务（Docker / FastAPI）模式额外需要：
standalone = [
    "boto3>=1.35.0",
    "fastapi>=0.116.1",
    "prometheus-client>=0.22.1",
    "uvicorn>=0.35.0",
]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
