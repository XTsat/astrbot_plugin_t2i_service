  原文件：template/diary/diary_legacy.html
  原文地址：https://github.com/Heximiao/astrbot_plugin_atrifeed/blob/main/template/diary/diary_legacy.html
  许可：原项目为 AGPL-3.0，本文件是它的衍生版本，同样按 AGPL-3.0 使用与分发，
        与插件其余部分（Apache-2.0）的许可相互独立。改编自本插件的适配，请勿移除本段声明。

  改动只有「变量从哪来」与正文的 Markdown 渲染，样式、结构与文案保持原样：
  * 正文：原模板吃 content，这里换成 AstrBot 提供的 text；上游那条链路喂的是纯文本，而消息正文
    常带 Markdown（**粗体**、列表、引用），所以由同目录 assets/markdown.js 在出图时渲染成 HTML
    （离线可用，不依赖 CDN）：字体、字号、行距与两端对齐都照原样，只多了块级元素的排版；
  * 日期、星期、字数、字号：原来是插件预计算，这里由末尾那段脚本按渲染时刻与正文长度现算，
    分档与上游 renderer.py 一致；
  * 天气：上游来自聊天情绪分析，这里每次渲染从上游那五档里随机取一个；
  * 心情卡：配图是上游写死的两张（好心情 pic/pictorial/my_atri1/emoji1.jpg、
    坏心情 pic/emoji/tired/atri_tired1.jpg，阴/雨算坏心情），文案取上游 ATRI_ONE_LINERS 里的一句；
  * 左右立绘：上游 pic/lihui/shop/atri6.png 与 pic/lihui/atri2.png；
  * 心情图与立绘放在同目录的 assets/ 下，模板里按「assets 目录 + 文件名」引用，插件读模板时
    再内联成 data URI（渲图用的是 file:// 临时文件，相对路径指不到插件目录）；
  * 字体：每处 font-family 保留原版字体名在前，其后追加插件可下载的替代字体
    （Noto Serif JP / Noto Sans JP / 霞鹜文楷），都没装则落回系统 CJK 字体。
-->

    <title>今日の日記 · ATRI</title>
    <style>
        :root {
            --ink: #563f34;
            --ink-soft: #8b6c5c;
            --paper: #fffdf6;
            --cream: #f6eddb;
            --pink: #efc8bf;
            --blue: #c8dfe3;
            --green: #ceddc4;
            --yellow: #f3dda2;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            width: 1000px;
            padding: 36px 28px 54px;
            color: var(--ink);
            background-color: #f7f1e7;
            background-image:
                radial-gradient(rgba(124, 96, 76, .16) 1.4px, transparent 1.4px),
                linear-gradient(135deg, rgba(255,255,255,.35), transparent 45%);
            background-size: 22px 22px, 100% 100%;
            font-family: "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", "Noto Sans JP", sans-serif;
        }
        .journal {
            position: relative;
            width: 900px;
            margin: 0 auto;
            padding: 54px 58px 48px;
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 18px 7px 16px 8px;
            box-shadow:
                9px 9px 0 var(--blue),
                18px 18px 0 var(--pink),
                0 28px 45px rgba(83, 61, 48, .18);
        }
        .journal::before {
            content: "";
            position: absolute;
            inset: 14px;
            border: 2px dashed rgba(104, 75, 58, .35);
            border-radius: 12px 5px 12px 5px;
            pointer-events: none;
        }
        .journal::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .22;
            background-image: url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.07'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .binding {
            position: absolute;
            left: 28px;
            top: 62px;
            bottom: 62px;

        }

        }
        .title-card {

            z-index: 2;

        .entry-illustrations {

            inset: 0;
            z-index: 0;

            border-radius: inherit;

        }
        .entry-illustration {
            position: absolute;
            bottom: -24px;

        .mood-card {

        .mood-photo {

            flex: 0 0 auto;

            height: 92px;
            object-fit: cover;
            border: 1px solid rgba(86, 63, 52, .22);
        }
        .mood-caption {
            margin-top: 0;
            color: var(--ink);
            font-family: "STKaiti", "KaiTi", "LXGW WenKai", "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-size: 18px;
            letter-spacing: 1px;

        }
        .mood-date {

            color: var(--ink-soft);
            font-family: Georgia, serif;

            letter-spacing: 2px;

        }
        .entry-paper::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            width: 105px;
            height: 29px;

            clip-path: polygon(3% 7%, 99% 0, 96% 94%, 0 100%);

        .holes {
            position: absolute;
            z-index: 2;
            left: 17px;
            top: 40px;
            bottom: 40px;
            width: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .hole {
            width: 13px;
            height: 13px;
            border: 1px solid rgba(86, 63, 52, .38);
            border-radius: 50%;
            background: #f7f1e7;
            box-shadow: inset 1px 1px 2px rgba(70, 48, 35, .18);
        }
        .entry {
            position: relative;
            z-index: 2;
            margin: 0;
            color: #49362d;
            font-family: "STKaiti", "KaiTi", "FangSong", "LXGW WenKai", "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-size: 27px;
            line-height: 1.72;
            letter-spacing: .075em;
            /* 正文渲染成 HTML 后换行由 <br> 负责，pre-wrap 会把生成的标签间隙也画成空行 */
            white-space: normal;
            overflow-wrap: anywhere;
            text-align: justify;
            text-justify: inter-ideograph;
        }

        /* 正文 Markdown 的块级排版：字号沿用正文，只补字重、缩进与边框，不另起一套配色 */
        .entry p { margin: 0 0 .72em; }
        .entry p:last-child { margin-bottom: 0; }
        .entry > :first-child { margin-top: 0; }
        .entry h1, .entry h2, .entry h3, .entry h4, .entry h5, .entry h6 {
            margin: .62em 0 .44em;
            font-weight: 700;
            line-height: 1.45;
            letter-spacing: .05em;
            color: #4a3229;
        }
        .entry h1 { font-size: 1.26em; }
        .entry h2 { font-size: 1.15em; }
        .entry h3 { font-size: 1.06em; }
        .entry h4, .entry h5, .entry h6 { font-size: 1em; }
        .entry strong { font-weight: 700; color: #3f2d25; }
        .entry em { font-style: italic; }
        .entry del { color: var(--ink-soft); }
        .entry ul, .entry ol { margin: 0 0 .72em; padding-left: 1.45em; }
        .entry li { margin: .16em 0; }
        .entry li::marker { color: #c98a72; }
        .entry blockquote {
            margin: 0 0 .72em;
            padding: .06em 0 .06em .9em;
            border-left: 3px solid var(--pink);

        }
        .entry a { color: #c1705c; text-decoration: underline; text-underline-offset: 2px; }
        .entry code {
            padding: .06em .3em;
            border-radius: 4px;
            background: rgba(239, 200, 191, .34);

            border-radius: 8px;

        }
        .entry pre code { padding: 0; background: none; font-size: .82em; }
        .entry hr {
            margin: .85em 0;
            border: 0;
            border-top: 1px dashed rgba(139, 108, 92, .45);
        }
        .entry table {
            width: 100%;
            margin: 0 0 .72em;
            border-collapse: collapse;
            font-size: .92em;
        }
        .entry th, .entry td {
            padding: .3em .5em;
            border-bottom: 1px solid rgba(139, 108, 92, .28);
            text-align: left;
        }
        .entry th { font-weight: 700; }

        /* 天气图标是内联 SVG，跟着文字颜色走，不依赖字体里的符号 */
        .wx {
            width: 1.05em;
            height: 1.05em;
            margin-right: .32em;
            vertical-align: -.14em;
        }

        .signature {
            position: absolute;
            z-index: 2;
            right: 38px;
            bottom: 20px;
            color: rgba(140, 87, 66, .75);
            font-family: "STKaiti", "KaiTi", "LXGW WenKai", "Noto Serif CJK SC", "Noto Serif SC", serif;

        }
        .footer {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 22px;
            margin-top: 34px;
            padding: 0 18px;
            color: var(--ink-soft);
            font-family: "STKaiti", "KaiTi", "LXGW WenKai", "Noto Serif CJK SC", "Noto Serif SC", serif;

        /* 页脚右侧只留渲染者的插件名：不加链接、不写「由 … 渲染」 */

        .pressed-flower {

        .corner-note {

            font-family: "STKaiti", "KaiTi", "LXGW WenKai", "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-size: 16px;

        }
            .wx-romaji {
            margin-left: .38em;
            font-family: Georgia, "Times New Roman", serif;
            font-size: .62em;
            letter-spacing: .1em;
            opacity: .68;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <main class="journal">
        <div class="binding"></div>
        <div class="pressed-flower">❀<br>╱</div>
        <div class="corner-note">亚托莉的碎碎念</div>

        <header class="header">
            <div class="title-card">
                <h1>今日の日記</h1>
                <div class="subtitle">ATRI'S DAILY DIARY</div>
            </div>
            <div class="date-card">
                <div class="date-main" id="diary-date"></div>
                <div class="date-meta"><span id="diary-weekday"></span> · 把今天好好收藏</div>
            </div>
        </header>

        <section class="stamps">
            <div class="stamp stamp-weather">
                <div class="stamp-label">今日天气</div>
                <div class="stamp-value" id="diary-weather"></div>
            </div>
            <div class="stamp stamp-count">
                <div class="stamp-label">写下</div>
                <div class="stamp-value"><span id="diary-chars"></span> 字</div>
            </div>
            <aside class="mood-card" id="diary-mood-card">
                <img class="mood-photo" id="diary-mood" alt="" data-good="assets/mood-good.jpg" data-bad="assets/mood-bad.jpg">
                <div class="mood-copy">
                    <div class="mood-caption" id="diary-caption"></div>
                    <div class="mood-date">MEMORY · <span id="diary-weekday-2"></span></div>
                </div>
            </aside>
        </section>

        <article class="entry-paper">
            <div class="entry-illustrations" aria-hidden="true">
                <img class="entry-illustration entry-illustration-left" id="diary-art-left" src="assets/art-left.webp" alt="">
                <img class="entry-illustration entry-illustration-right" id="diary-art-right" src="assets/art-right.webp" alt="">
            </div>
            <div class="holes">
                <i class="hole"></i><i class="hole"></i><i class="hole"></i>
                <i class="hole"></i><i class="hole"></i><i class="hole"></i>
            </div>
            <!-- 正文由文末脚本按 Markdown 渲染进来；原始消息放在页面末尾的隐藏节点里 -->
            <div class="entry" id="diary-body"></div>
            <div class="signature">— ATRI</div>
        </article>

        <footer class="footer">
            <span>地球に私も含まれますか？</span>
            <span class="renderer-mark">astrbot_plugin_t2i_service</span>
        </footer>
    </main>

  <!-- 原始正文：hidden 保证它不参与排版，脚本读 textContent（已转义过，取回来就是原文） -->
  <div id="diary-source" hidden>{{ text | e }}</div>

  <script src="assets/markdown.js"></script>
  <script>
    (function () {
      var REFRESH_MINUTES = 15;   // 由插件按配置改写，见 templates.refresh_minutes
      function set(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      // 天气图标用内联 SVG：☀ ☂ 这类符号依赖字体覆盖，服务器上常常缺字，画出来不挑字体
      function weatherIcon(kind) {
        var icons = {
          sun: '<circle cx="12" cy="12" r="4.6"/><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/>',
          cloud: '<path d="M6.5 18h11a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 6.5 18Z"/>',
          suncloud: '<circle cx="9" cy="8.5" r="3.1"/><path d="M9 2.6v1.6M2.6 8.5h1.6M4.4 3.9l1.1 1.1M13.6 3.9l-1.1 1.1"/><path d="M8.2 19h8.6a3 3 0 0 0 .3-6 4.2 4.2 0 0 0-8.1-1A3.3 3.3 0 0 0 8.2 19Z"/>',
          rain: '<path d="M6.5 15h11a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 6.5 15Z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>'
        };
        return '<svg class="wx" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          (icons[kind] || icons.cloud) + '</svg>';
      }

      function setWeather(id, weather) {
        var el = document.getElementById(id);
        if (el) {
          el.innerHTML = weatherIcon(weather.icon) +
            '<span>' + weather.display +
            (weather.romaji ? '<small class="wx-romaji">' + weather.romaji + '</small>' : '') +
            '</span>';
        }
      }

      // 预览（面板里的模板图）每次都换一档天气；真实出图按天固定
      var PREVIEW = "{{ preview | default('') }}" !== "";

      var body = document.getElementById("diary-body");
      // 正文按 Markdown 渲染；渲染器没加载出来时退回纯文本，至少内容还在
      var source = document.getElementById("diary-source");
      var plain = source ? source.textContent || "" : "";
      if (body) {
        body.textContent = plain;
        if (window.t2iMarkdown) body.innerHTML = window.t2iMarkdown(plain);
      }
      var now = new Date();
      var idx = (now.getDay() + 6) % 7;

      // 日期 / 星期：与上游 renderer.py 一样的格式（星期日用中文，新版另给日文星期）
      set("diary-date", now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日");
      set("diary-weekday", ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"][idx]);

      // 天气：上游从当天消息的情绪分析里取，AstrBot 没有这份数据，随机取一档
      var weathers = [
        { word: "晴", icon: "sun", display: "晴れ", romaji: "HARE" },
        { word: "多云", icon: "suncloud", display: "薄曇り", romaji: "USUGUMORI" },
        { word: "阴", icon: "cloud", display: "曇り", romaji: "KUMORI" },
        { word: "雨", icon: "rain", display: "雨", romaji: "AME" },
        { word: "多云转晴", icon: "suncloud", display: "曇りのち晴れ", romaji: "KUMORI NOCHI HARE" }
      ];
      // 时间分桶：桶号每 REFRESH_MINUTES 分钟变一次，桶内天气 / 心情 / 台词都保持一致，
      // 跨桶自动换新；面板的预览渲染带 preview 变量，预览仍每次随机，方便逐档看效果。
      var bucket = Math.floor(now.getTime() / (REFRESH_MINUTES * 60000));
      // 桶号散列成 32 位再取模（Math.imul 不丢精度），相邻时段不会只挪一位
      var seed = Math.imul(bucket ^ 0x9e3779b9, 16777619) >>> 0;

      var weather;
      if (PREVIEW) {
        weather = weathers[Math.floor(Math.random() * weathers.length)];
      } else {
        weather = weathers[seed % weathers.length];
      }
      setWeather("diary-weather", weather);

      // 心情：阴 / 雨 判为坏心情，配图与卡片阴影跟着换（同上游）
      var bad = weather.word === "阴" || weather.word === "雨";
      var moodImg = document.getElementById("diary-mood");
      if (moodImg) {
        // data-good / data-bad 在渲染前已由插件换成图片本身，这里只挑一个用
        moodImg.src = bad ? moodImg.dataset.bad : moodImg.dataset.good;
        moodImg.alt = bad ? "今日心情：有点低落" : "今日心情：还不错";
      }
      var moodCard = document.getElementById("diary-mood-card");
      if (moodCard && bad) moodCard.classList.add("mood-bad");
      var captions = [
        "今日も高性能です！",
        "大切な思い出を残しましょう！",
        "今天的回忆也要好好保存。",
        "海风正好，适合记录今天。",
        "能源充足，状态良好！",
        "普通的一天也值得珍藏。"
      ];
      set("diary-caption", PREVIEW
        ? captions[Math.floor(Math.random() * captions.length)]
        : captions[(seed >>> 7) % captions.length]);


      // 字数与字号：上游 word_count 就是正文长度，font_size 按长度分档
      var chars = (body.textContent || "").trim().length;
      set("diary-chars", String(chars));
      if (body) body.style.fontSize = (function (n) { return n <= 100 ? 31 : n <= 220 ? 27 : n <= 400 ? 24 : n <= 600 ? 21 : 18; })(chars) + "px";
    })();
  </script>
</body>
</html>
